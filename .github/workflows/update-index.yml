# Rewrites index.json after a sequence file is merged, so contributors never have to touch it.
name: Update index

on:
  push:
    branches: [main]
    paths:
      - "sequences/**"
      - "scripts/build_index.py"

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and rebuild index.json
        run: python3 scripts/build_index.py
      - name: Commit the new index
        run: |
          if git diff --quiet -- index.json; then
            echo "index.json already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "Update index.json"
          git push
