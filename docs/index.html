<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Airbox Sequences</title>
<meta name="description" content="Create, edit and share sequences for the Airbox.">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
/* A plain website that keeps the identity of the Airbox app: its icon, blue accent, status colors and tone. */
:root{
  --bg:#f7f8fa; --panel:#ffffff; --fg:#14181f; --muted:#5f6b7a; --line:#dde2e9; --accent:#0a6cf0; --accent-fg:#ffffff;
  --green:#1f9d55; --orange:#c76a00; --red:#d92d20; --teal:#0e8fa3; --purple:#7a4fd6; --code:#eef1f5;
  --warnbg:#fff4e5; --okbg:#e8f6ee; --badbg:#fdecea;
  --font-ui:system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1116; --panel:#161b22; --fg:#e8ecf1; --muted:#9aa5b3; --line:#2b333d; --accent:#4d9bff; --accent-fg:#06121f;
  --green:#4cc38a; --orange:#f0a24b; --red:#ff7b72; --teal:#4cc2d6; --purple:#a98bff; --code:#1f262f;
  --warnbg:#2a2113; --okbg:#122419; --badbg:#2d1715;}}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-ui);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
a{color:var(--accent)}
code{font-family:var(--font-mono);font-size:.85em;background:var(--code);padding:1px 6px;border-radius:4px}
.mono{font-family:var(--font-mono);font-size:.88rem}
.muted{color:var(--muted)}.sub{color:var(--muted);font-size:.86rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.site{background:var(--panel);border-bottom:1px solid var(--line)}
.site-in{max-width:1000px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;padding:10px 0;font-weight:700;color:var(--fg);text-decoration:none}
.brand img{width:30px;height:30px;border-radius:7px;display:block}
.nav{display:flex;gap:2px}
.nav a{padding:16px 12px;font-size:.92rem;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent}
.nav a:hover{color:var(--fg)}
.nav a[aria-current="page"]{color:var(--fg);font-weight:600;border-bottom-color:var(--accent)}
.site .ext{font-size:.88rem;color:var(--muted);text-decoration:none}
.site .ext:hover{color:var(--fg)}
.right{margin-left:auto;display:flex;align-items:center;gap:14px}
.lang{display:flex;gap:4px}
.flag{display:grid;place-items:center;width:36px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--panel);cursor:pointer;opacity:.6;padding:0}
.flag:hover{opacity:1}
.flag[aria-pressed="true"]{opacity:1;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.flag svg{display:block;width:24px;height:auto;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
main{max-width:1000px;margin:0 auto;padding:22px 16px 56px}
h1{font-size:1.4rem;margin:0 0 4px}
h2{font-size:1.05rem;margin:22px 0 8px}
.view[hidden]{display:none}

/* buttons and controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:.9rem;font-weight:500;background:var(--accent);color:var(--accent-fg);border:1px solid var(--accent);border-radius:6px;padding:7px 14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.alt{background:var(--panel);color:var(--fg);border-color:var(--line)}
.btn.alt:hover{background:var(--code);filter:none}
.btn.sm{padding:4px 10px;font-size:.84rem}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.input,select.input,textarea.input{border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:var(--bg);font-size:.95rem;min-width:0;width:100%}
.input.bad,.num.bad{border-color:var(--red);background:var(--badbg)}
select.sel,input.num{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:4px 8px;font-size:.9rem}
input.num{font-family:var(--font-mono);width:76px;text-align:right}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:0}
.pad{padding:14px 16px}

/* editor */
.editor{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start;margin-top:16px}
@media(max-width:760px){.editor{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.form{display:grid;grid-template-columns:90px minmax(0,1fr);gap:10px 12px;align-items:center;padding:14px 16px}
.form label{font-size:.86rem;color:var(--muted)}
@media(max-width:480px){.form{grid-template-columns:1fr}}
.steps{display:flex;flex-direction:column;gap:8px}
.step{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.tag{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;border-radius:4px;padding:2px 7px;min-width:82px;text-align:center}
.t-relay{background:rgba(199,106,0,.14);color:var(--orange)}
.t-wait{background:var(--code);color:var(--muted)}
.t-rand{background:rgba(14,143,163,.14);color:var(--teal)}
.t-group{background:rgba(122,79,214,.14);color:var(--purple)}
.nest{margin:8px 0 2px 10px;padding-left:12px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.add{display:flex;gap:8px;flex-wrap:wrap}
.empty{border:1px dashed var(--line);border-radius:8px;padding:18px;text-align:center;color:var(--muted)}
.menu{margin-left:auto;position:relative}
.menu summary{list-style:none;cursor:pointer;color:var(--muted);width:28px;height:28px;display:grid;place-items:center;border-radius:5px;font-weight:700;user-select:none}
.menu summary::-webkit-details-marker{display:none}
.menu summary:hover,.menu[open] summary{background:var(--code);color:var(--fg)}
.menu-list{position:absolute;right:0;top:30px;z-index:5;min-width:150px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.18);padding:4px;display:flex;flex-direction:column}
.menu-list button{background:none;border:0;text-align:left;padding:6px 10px;border-radius:5px;cursor:pointer;font-size:.9rem}
.menu-list button:hover:not([disabled]){background:var(--code)}
.menu-list button[disabled]{opacity:.4;cursor:default}
.menu-list .danger{color:var(--red)}

/* side */
.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:12px}
.side .btn{width:100%}
.big{font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.status{border-radius:6px;padding:7px 10px;font-size:.86rem;font-weight:600}
.status.ok{background:var(--okbg);color:var(--green)}
.status.warn{background:var(--warnbg);color:var(--orange)}
.status.bad{background:var(--badbg);color:var(--red)}
.status span,.status li{font-weight:400;color:var(--muted)}
.status ul{margin:4px 0 0;padding-left:1.1rem}
.status .stack{display:flex;flex-direction:column;gap:6px}
.caps{display:grid;grid-template-columns:1fr auto;gap:6px 8px;align-items:center;font-size:.86rem}
.saved{font-size:.8rem;color:var(--muted)}

/* catalog */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.92rem}
th{text-align:left;font-weight:600;font-size:.8rem;color:var(--muted);padding:9px 14px;border-bottom:1px solid var(--line)}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.act{text-align:right}
.desc{display:block;color:var(--muted);font-size:.84rem}

/* format view */
.prose{max-width:72ch}
.prose p,.prose ul{margin:0 0 10px}
.prose ul{padding-left:1.2rem}
.prose table{min-width:0;margin:0 0 12px}
.prose th,.prose td{padding:7px 10px}
.prose .panel{overflow-x:auto}

/* dialog */
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--fg);padding:20px;width:min(480px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(10,14,20,.5)}
dialog h3{margin:0 0 10px;font-size:1.1rem}
dialog .body{display:flex;flex-direction:column;gap:12px}
dialog ol{margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:4px;font-size:.92rem}
dialog .actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.pre{font-family:var(--font-mono);font-size:.76rem;background:var(--code);border-radius:6px;padding:9px 12px;color:var(--muted);overflow-x:auto;white-space:pre}
.choice{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto}
.choice button{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer}
.choice button:hover{background:var(--code)}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.86rem;color:var(--muted)}
.err{color:var(--red);font-size:.84rem}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);border-radius:8px;padding:9px 16px;font-size:.9rem;max-width:calc(100vw - 32px);z-index:20}
#toast[hidden]{display:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<header class="site">
  <div class="site-in">
    <a class="brand" href="#editeur"><img src="icon.png" alt="" width="30" height="30"><span data-i18n="brand">Airbox Sequences</span></a>
    <nav class="nav" aria-label="Pages">
      <a href="#editeur" data-nav="editeur" data-i18n="nav_editor">Editor</a>
      <a href="#catalogue" data-nav="catalogue" data-i18n="nav_catalog">Catalog</a>
      <a href="#format" data-nav="format" data-i18n="nav_format">Format</a>
    </nav>
    <div class="right">
      <div class="lang" role="group" id="lang-group">
        <button class="flag" type="button" data-lang="en" aria-pressed="false" aria-label="English" title="English"><svg viewBox="0 0 60 30" aria-hidden="true"><rect width="60" height="30" fill="#012169"/><path d="M0,0 60,30M60,0 0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 60,30M60,0 0,30" stroke="#C8102E" stroke-width="2"/><path d="M30,0v30M0,15h60" stroke="#fff" stroke-width="10"/><path d="M30,0v30M0,15h60" stroke="#C8102E" stroke-width="6"/></svg></button>
        <button class="flag" type="button" data-lang="fr" aria-pressed="false" aria-label="Français" title="Français"><svg viewBox="0 0 60 40" aria-hidden="true"><rect width="20" height="40" fill="#0055A4"/><rect x="20" width="20" height="40" fill="#fff"/><rect x="40" width="20" height="40" fill="#EF4135"/></svg></button>
      </div>
      <a class="ext" href="https://github.com/rubtatex/airbox-sequences" target="_blank" rel="noopener">GitHub ↗</a>
    </div>
  </div>
</header>

<main>
  <!-- Editor -->
  <section class="view" id="view-editeur" aria-labelledby="t-editeur">
    <h1 id="t-editeur" data-i18n="ed_title">Sequence editor</h1>
    <p class="muted" style="margin:0;max-width:70ch" data-i18n="ed_intro"></p>
    <div class="editor">
      <div class="col">
        <div class="panel form">
          <label for="f-name" data-i18n="lbl_name">Name</label><input class="input" id="f-name" maxlength="80" autocomplete="off">
          <label for="f-author" data-i18n="lbl_author">Author</label><input class="input" id="f-author" maxlength="500" autocomplete="off">
          <label for="f-desc" data-i18n="lbl_desc">Description</label><input class="input" id="f-desc" maxlength="500" autocomplete="off">
        </div>
        <div class="steps" id="steps"></div>
        <div class="add" id="root-add"></div>
      </div>
      <aside class="side" id="side">
        <div class="panel pad" style="display:flex;flex-direction:column;gap:10px">
          <div><span class="sub" data-i18n="lbl_duration">Duration</span><div class="big" id="a-duration">0 s</div></div>
          <div class="sub" id="a-meta"></div>
          <div id="a-status"></div>
          <div class="caps">
            <label for="cap-rebreath" data-i18n="cap_rebreath">Re-Breath cap (s)</label><input class="num" id="cap-rebreath" type="number" min="5" max="300" inputmode="numeric">
            <label for="cap-air" data-i18n="cap_air">Air cap (s)</label><input class="num" id="cap-air" type="number" min="5" max="300" inputmode="numeric">
          </div>
        </div>
        <button class="btn" id="b-propose" type="button" data-i18n="b_propose">Propose to the community</button>
        <button class="btn alt" id="b-export" type="button" data-i18n="b_export">Export the file</button>
        <button class="btn alt" id="b-import" type="button" data-i18n="b_import">Import a file</button>
        <button class="btn alt" id="b-new" type="button" data-i18n="b_new">New sequence</button>
        <input id="file" type="file" accept=".json,application/json" hidden>
        <span class="saved" data-i18n="saved">Draft saved in this browser</span>
      </aside>
    </div>
  </section>

  <!-- Catalog -->
  <section class="view" id="view-catalogue" aria-labelledby="t-catalogue" hidden>
    <h1 id="t-catalogue" data-i18n="cat_title">Catalog</h1>
    <p class="muted" style="margin:0 0 16px" data-i18n="cat_intro"></p>
    <div id="catalog"></div>
  </section>

  <!-- Format -->
  <section class="view prose" id="view-format" aria-labelledby="t-format" hidden>
    <h1 id="t-format" data-i18n="fmt_title">Sequence format</h1>
    <p class="muted" data-i18n-html="fmt_intro"></p>
    <h2 data-i18n="fmt_h_blocks">The building blocks</h2>
    <div class="panel"><table>
      <tr><th data-i18n="th_block">Block</th><th data-i18n="th_effect">Effect</th></tr>
      <tr><td data-i18n="tag_relay">Command</td><td data-i18n="fmt_cmd"></td></tr>
      <tr><td data-i18n="tag_wait">Wait</td><td data-i18n="fmt_wait"></td></tr>
      <tr><td data-i18n="tag_together">Together</td><td data-i18n="fmt_together"></td></tr>
      <tr><td data-i18n="tag_repeat">Repeat</td><td data-i18n="fmt_repeat"></td></tr>
    </table></div>
    <h2 data-i18n="fmt_h_limits">Limits</h2>
    <ul>
      <li data-i18n="fmt_l1"></li>
      <li data-i18n="fmt_l2"></li>
      <li data-i18n="fmt_l3"></li>
      <li data-i18n="fmt_l4"></li>
    </ul>
    <h2 data-i18n="fmt_h_more">Learn more</h2>
    <ul>
      <li><a href="https://github.com/rubtatex/airbox-sequences/blob/main/FORMAT.md" target="_blank" rel="noopener" data-i18n="fmt_link1">Full format description</a></li>
      <li><a href="https://github.com/rubtatex/airbox-sequences/blob/main/schema.json" target="_blank" rel="noopener" data-i18n="fmt_link2">JSON schema</a></li>
      <li data-i18n="fmt_l5"></li>
    </ul>
  </section>
</main>

<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>

      } else {
        head = '<span class="tag t-group">' + esc(t('tag_together')) + '</span><span class="sub">' + esc(t('together_hint')) + '</span>';
        nest = '<div class="nest">' + renderList(n.children, path, depth + 1) + '<div class="add">' + addRow(path, depth + 1) + '</div></div>';
      }
      return '<div class="step"><div class="line">' + head + m + '</div>' + nest + '</div>';
    }).join('');
  }
  function render() {
    $('steps').innerHTML = seq.steps.length ? renderList(seq.steps, '', 1) : '<div class="empty">' + esc(t('empty_steps')) + '</div>';
    $('root-add').innerHTML = addRow('', 1);
    updateSide();
  }
  function updateSide() {
    var a = analyse(seq.steps), probs = problems();
    $('a-duration').textContent = a.min === a.max ? fmt(a.max) : fmt(a.min) + ' ' + t('to') + ' ' + fmt(a.max);
    $('a-meta').textContent = a.actions + ' ' + t(a.actions > 1 ? 'action_many' : 'action_one') + (a.relays.length ? ' · ' + a.relays.map(function (r) { return RELAYS[r].label; }).join(', ') : '');
    var html = '';
    if (probs.length) {
      html = '<div class="status bad"><div class="stack">' + probs.map(function (p) { return '<div>' + esc(p) + '</div>'; }).join('') + '</div></div>';
    } else if (a.warnings.length) {
      html = '<div class="status warn"><div class="stack">' + a.warnings.map(function (w) {
        return '<div>' + esc(t(w.relay === 'rebreath' ? 'warn_open' : 'warn_closed', { r: RELAYS[w.relay].label, s: w.seconds })) + '<span>' + esc(t('warn_detail', { cap: w.cap })) + '</span></div>';
      }).join('') + '</div></div>';
    } else {
      html = '<div class="status ok">' + esc(t('ok_caps')) + '</div>';
    }
    $('a-status').innerHTML = html;
    $('b-propose').disabled = probs.length > 0;
    $('b-export').disabled = probs.length > 0;
    store(DRAFT_KEY, seq);
  }

  // ---- editor events ----
  function addNode(kind) {
    if (kind === 'relay') return { type: 'relay', relay: 'rebreath', action: 'open' };
    if (kind === 'wait') return { type: 'wait', random: false, min: 10, max: 10 };
    if (kind === 'together') return { type: 'together', children: [] };
    return { type: 'repeat', count: 2, children: [] };
  }
  function clone(n) { return JSON.parse(JSON.stringify(n)); }
  function onClick(e) {
    var btn = e.target.closest('[data-act]');
    if (!btn || btn.disabled) return;
    var act = btn.getAttribute('data-act'), path = btn.getAttribute('data-path');
    if (act === 'add') {
      getContainer(path).push(addNode(btn.getAttribute('data-kind')));
    } else {
      var p = splitPath(path), list = getContainer(p.parent);
      if (act === 'del') list.splice(p.index, 1);
      else if (act === 'dup') list.splice(p.index + 1, 0, clone(list[p.index]));
      else if (act === 'up' && p.index > 0) { var t = list[p.index]; list[p.index] = list[p.index - 1]; list[p.index - 1] = t; }
      else if (act === 'down' && p.index < list.length - 1) { var u = list[p.index]; list[p.index] = list[p.index + 1]; list[p.index + 1] = u; }
    }
    render();
  }
  function onField(e) {
    var el = e.target, field = el.getAttribute('data-field');
    if (!field) return;
    var p = splitPath(el.getAttribute('data-path')), n = getContainer(p.parent)[p.index];
    var isSelect = el.tagName === 'SELECT', v = isSelect ? el.value : (el.value === '' ? NaN : Number(el.value));
    if (field === 'relay') { n.relay = v; n.action = RELAYS[v].acts[0][0]; render(); return; }
    if (field === 'action') { n.action = v; updateSide(); return; }
    if (field === 'mode') {
      if (v === 'random') { n.random = true; n.max = inRange(n.min, 1, LIM.wait) ? Math.min(LIM.wait, n.min * 2) : n.min; }
      else { n.random = false; n.max = n.min; }
      render(); return;
    }
    if (field === 'fixed') { n.min = v; n.max = v; }
    else if (field === 'min') n.min = v;
    else if (field === 'max') n.max = v;
    else if (field === 'count') n.count = v;
    var lo = field === 'count' ? 1 : 1, hi = field === 'count' ? LIM.repeat : LIM.wait;
    var bad = !inRange(v, lo, hi) || (n.type === 'wait' && n.random && n.min > n.max);
    el.classList.toggle('bad', bad);
    updateSide();
  }

  // ---- dialogs ----
  var dlg = $('dlg');
  function openDialog(html, onReady) {
    dlg.innerHTML = html;
    if (!dlg.open) dlg.showModal();
    dlg.querySelectorAll('[data-close]').forEach(function (b) { b.addEventListener('click', function () { dlg.close(); }); });
    if (onReady) onReady(dlg);
  }
  function confirmReplace(then) {
    if (!seq.steps.length) { then(); return; }
    openDialog('<h3>' + esc(t('replace_title')) + '</h3><div class="body"><p>' + esc(t('replace_body', { name: seq.name || t('unnamed') })) + '</p>' +
      '<div class="actions"><button class="btn alt" data-close type="button">' + esc(t('cancel')) + '</button><button class="btn" id="d-ok" type="button">' + esc(t('replace')) + '</button></div></div>',
      function () { $('d-ok').addEventListener('click', function () { dlg.close(); then(); }); });
  }
  function setSequence(s) {
    seq = s;
    $('f-name').value = seq.name; $('f-author').value = seq.author; $('f-desc').value = seq.description;
    render();
  }
  function openParsed(list, label) {
    function use(s) { confirmReplace(function () { setSequence(s); location.hash = '#editeur'; toast(t('opened_toast', { name: s.name })); }); }
    if (list.length === 1) { use(list[0]); return; }
    openDialog('<h3>' + esc(t('choose_title')) + '</h3><div class="body"><p class="sub">' + esc(t('choose_body', { file: label, n: list.length })) + '</p><div class="choice">' +
      list.map(function (s, i) { return '<button type="button" data-i="' + i + '">' + esc(s.name) + '</button>'; }).join('') +
      '</div><div class="actions"><button class="btn alt" data-close type="button">' + esc(t('cancel')) + '</button></div></div>',
      function (d) { d.querySelectorAll('[data-i]').forEach(function (b) { b.addEventListener('click', function () { d.close(); use(list[+b.getAttribute('data-i')]); }); }); });
  }

  // ---- export / import ----
  function onExport() {
    if (problems().length) return;
    var text = JSON.stringify(toFile(), null, 2) + '\n';
    var url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    var a = document.createElement('a');
    a.href = url; a.download = (slug(seq.name) || 'sequence') + '.airbox.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    toast(t('exported'));
  }
  function onFile(e) {
    var f = e.target.files[0]; e.target.value = '';
    if (!f) return;
    if (f.size > LIM.file) { toast(t('toast_big')); return; }
    var r = new FileReader();
    r.onload = function () {
      try { openParsed(parseFile(String(r.result)), f.name); }
      catch (err) { toast(err instanceof Invalid ? t('import_fail', { m: err.message }) : t('import_fail0')); }
    };
    r.readAsText(f);
  }

  // ---- propose ----
  function newFileUrl(file, name) {
    var base = 'https://github.com/' + REPO + '/new/main/sequences?filename=' + encodeURIComponent(file) + '&message=' + encodeURIComponent('Add ' + name) + '&value=';
    var pretty = base + encodeURIComponent(JSON.stringify(toFile(), null, 2) + '\n');
    if (pretty.length <= 7500) return pretty;
    var compact = base + encodeURIComponent(JSON.stringify(toFile()) + '\n');
    return compact.length <= 7500 ? compact : null;
  }
  function onPropose() {
    if (problems().length) return;
    var initial = slug(seq.name);
    openDialog('<h3>' + esc(t('prop_title', { name: seq.name.trim() })) + '</h3><div class="body">' +
      '<ol><li>' + esc(t('prop_1')) + '</li><li>' + esc(t('prop_2')) + '</li><li>' + esc(t('prop_3')) + '</li></ol>' +
      '<div class="field"><label for="d-file">' + esc(t('prop_file')) + '</label><div style="display:flex;gap:6px;align-items:center"><input class="input" id="d-file" value="' + esc(initial) + '" autocomplete="off" spellcheck="false"><span class="mono">.airbox.json</span></div><span class="err" id="d-err"></span></div>' +
      '<p class="sub">' + esc(t('prop_note') + (seq.author.trim() ? '' : t('prop_author'))) + '</p>' +
      '<div class="actions"><button class="btn alt" data-close type="button">' + esc(t('cancel')) + '</button><button class="btn" id="d-go" type="button">' + esc(t('prop_open')) + '</button></div></div>',
      function () {
        var input = $('d-file'), err = $('d-err'), go = $('d-go');
        function check() {
          var v = input.value.trim(), msg = '';
          if (!NAME_RE.test(v)) msg = t('prop_err_name');
          else if (catalogIndex && catalogIndex.sequences.some(function (s) { return s.id === v; })) msg = t('prop_err_exists');
          err.textContent = msg; go.disabled = !!msg;
        }
        input.addEventListener('input', check); check();
        if (!catalogIndex) loadCatalog().then(check);
        go.addEventListener('click', function () {
          var url = newFileUrl(input.value.trim() + '.airbox.json', seq.name.trim());
          if (!url) { err.textContent = t('prop_err_long'); return; }
          window.open(url, '_blank', 'noopener');
          dlg.close();
        });
      });
  }

  // ---- catalog ----
  function loadCatalog() {
    if (catalogIndex) return Promise.resolve();
    if (catalogLoading) return catalogLoading;
    catalogError = null;
    catalogLoading = fetch(RAW + 'index.json', { cache: 'no-cache' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (j) { if (!j || !Array.isArray(j.sequences)) throw new Error('index invalide'); catalogIndex = j; })
      .catch(function (e) { catalogError = e.message; })
      .then(function () { catalogLoading = false; renderCatalog(); });
    renderCatalog();
    return catalogLoading;
  }
  function renderCatalog() {
    var el = $('catalog');
    if (catalogLoading) { el.innerHTML = '<p class="muted">' + esc(t('cat_loading')) + '</p>'; return; }
    if (catalogError) { el.innerHTML = '<div class="status bad">' + esc(t('cat_error', { m: catalogError })) + '</div><p style="margin-top:12px"><button class="btn alt" id="c-retry" type="button">' + esc(t('retry')) + '</button></p>'; $('c-retry').addEventListener('click', loadCatalog); return; }
    if (!catalogIndex) { el.innerHTML = ''; return; }
    if (!catalogIndex.sequences.length) { el.innerHTML = '<div class="empty">' + esc(t('cat_empty')) + '</div>'; return; }
    el.innerHTML = '<div class="panel tablewrap"><table><thead><tr><th>' + esc(t('th_seq')) + '</th><th>' + esc(t('th_author')) + '</th><th>' + esc(t('th_duration')) + '</th><th>' + esc(t('th_relays')) + '</th><th></th></tr></thead><tbody>' +
      catalogIndex.sequences.map(function (s, i) {
        return '<tr><td><b>' + esc(s.name) + '</b>' + (s.description ? '<span class="desc">' + esc(s.description) + '</span>' : '') + '</td><td>' + esc(s.author || '') + '</td><td>' +
          (typeof s.durationSeconds === 'number' ? t('up_to', { d: fmt(s.durationSeconds) }) : '') + '</td><td>' +
          esc((s.relays || []).map(function (r) { return RELAYS[r] ? RELAYS[r].label : r; }).join(', ')) + '</td><td class="act"><button class="btn alt sm" type="button" data-open="' + i + '">' + esc(t('open_editor')) + '</button></td></tr>';
      }).join('') + '</tbody></table></div>';
    el.querySelectorAll('[data-open]').forEach(function (b) {
      b.addEventListener('click', function () {
        var s = catalogIndex.sequences[+b.getAttribute('data-open')];
        if (!s || typeof s.path !== 'string' || !/^sequences\/[a-z0-9-]+\.airbox\.json$/.test(s.path)) { toast(t('cat_invalid')); return; }
        b.disabled = true;
        fetch(RAW + s.path, { cache: 'no-cache' })
          .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
          .then(function (t) { openParsed(parseFile(t), s.name); })
          .catch(function (err) { toast(err instanceof Invalid ? t('open_fail_m', { m: err.message }) : t('open_fail')); })
          .then(function () { b.disabled = false; });
      });
    });
  }

  // ---- routing ----
  function route() {
    var h = (location.hash || '#editeur').slice(1);
    if (['editeur', 'catalogue', 'format'].indexOf(h) < 0) h = 'editeur';
    ['editeur', 'catalogue', 'format'].forEach(function (v) { $('view-' + v).hidden = v !== h; });
    document.querySelectorAll('[data-nav]').forEach(function (a) {
      if (a.getAttribute('data-nav') === h) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    if (h === 'catalogue') loadCatalog();
    document.title = t(h === 'editeur' ? 'page_editor' : h === 'catalogue' ? 'page_catalog' : 'page_format') + ' · ' + t('brand');
  }

  // ---- init ----
  restore();
  $('f-name').value = seq.name; $('f-author').value = seq.author; $('f-desc').value = seq.description;
  $('cap-rebreath').value = caps.rebreath; $('cap-air').value = caps.air;
  ['f-name', 'f-author', 'f-desc'].forEach(function (id) {
    $(id).addEventListener('input', function () { seq.name = $('f-name').value; seq.author = $('f-author').value; seq.description = $('f-desc').value; updateSide(); });
  });
  ['rebreath', 'air'].forEach(function (k) {
    $('cap-' + k).addEventListener('input', function (e) {
      var v = Number(e.target.value), ok = inRange(v, 5, 300);
      e.target.classList.toggle('bad', !ok);
      if (ok) { caps[k] = v; store(CAPS_KEY, caps); updateSide(); }
    });
  });
  $('view-editeur').addEventListener('click', onClick);
  $('view-editeur').addEventListener('change', onField);
  $('view-editeur').addEventListener('input', function (e) { if (e.target.tagName === 'INPUT' && e.target.getAttribute('data-field')) onField(e); });
  document.addEventListener('click', function (e) {
    document.querySelectorAll('details.menu[open]').forEach(function (d) { if (!d.contains(e.target)) d.removeAttribute('open'); });
  });
  $('b-export').addEventListener('click', onExport);
  $('b-propose').addEventListener('click', onPropose);
  $('b-import').addEventListener('click', function () { $('file').click(); });
  $('file').addEventListener('change', onFile);
  $('b-new').addEventListener('click', function () {
    confirmReplace(function () { setSequence({ name: '', author: '', description: '', steps: [] }); $('f-name').focus(); });
  });
  function applyLang() {
    document.documentElement.lang = lang;
    var d = document.querySelector('meta[name="description"]'); if (d) d.setAttribute('content', t('doc_desc'));
    document.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = t(el.getAttribute('data-i18n')); });
    document.querySelectorAll('[data-i18n-html]').forEach(function (el) { el.innerHTML = t(el.getAttribute('data-i18n-html')); });
    document.querySelectorAll('#lang-group [data-lang]').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-lang') === lang ? 'true' : 'false'); });
    $('lang-group').setAttribute('aria-label', t('lang_label'));
    render(); renderCatalog(); route();
  }
  function setLang(next) {
    if (next === lang) return;
    var prev = lang;
    // An untouched default example follows the language.
    if (seq.name === T[prev].default_name) seq.name = T[next].default_name;
    if (seq.description === T[prev].default_desc) seq.description = T[next].default_desc;
    lang = next;
    try { localStorage.setItem('airbox-seq-lang', lang); } catch (e) { /* private mode */ }
    $('f-name').value = seq.name; $('f-desc').value = seq.description;
    applyLang();
  }
  document.querySelectorAll('#lang-group [data-lang]').forEach(function (b) { b.addEventListener('click', function () { setLang(b.getAttribute('data-lang')); }); });
  window.addEventListener('hashchange', route);
  applyLang();
  window.__airbox = { setLang: setLang, t: t, analyse: analyse, parseFile: parseFile, toFile: toFile, setSequence: setSequence, problems: problems, newFileUrl: newFileUrl };
})();
</script>
</body>
</html>
